<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Heist - Iron Style</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050507;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Arial, sans-serif;
    }
    body { display: grid; place-items: center; }
    .game {
      position: relative;
      width: min(100vw, 1180px);
      height: min(100vh, 700px);
      min-height: 540px;
      overflow: hidden;
      background: #070709;
      border: 4px solid #4b1111;
      box-shadow: 0 0 0 2px #111, 0 22px 70px rgba(0, 0, 0, 0.75), inset 0 0 80px rgba(160, 0, 0, 0.16);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      color: #f3e8d8;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 3px 0 #000, 0 0 16px rgba(255, 50, 20, 0.45);
    }
    .hud-left, .hud-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .badge {
      min-width: 138px;
      padding: 9px 12px;
      background: linear-gradient(135deg, rgba(18, 18, 20, 0.92), rgba(51, 9, 9, 0.9));
      border: 3px solid #1c1c1f;
      outline: 2px solid rgba(173, 26, 18, 0.82);
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.58), inset 0 0 18px rgba(255, 72, 20, 0.12);
      font-size: 12px;
      line-height: 1.05;
    }
    .badge strong {
      display: block;
      margin-top: 5px;
      color: #fff8e8;
      font-size: 24px;
    }
    .power-bar {
      width: 180px;
      height: 18px;
      margin-top: 7px;
      padding: 3px;
      background: #050505;
      border: 2px solid #2b2b2f;
      outline: 2px solid #89160f;
      transform: skewX(-12deg);
      overflow: hidden;
    }
    .power-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff3c16, #b70f0b 58%, #3a0505);
      box-shadow: 0 0 16px rgba(255, 47, 13, 0.9);
      transform-origin: left center;
    }
    .fury-bar {
      outline-color: #c96b12;
    }
    .fury-fill {
      background: linear-gradient(90deg, #ffb02e, #ff4b1e 60%, #8e1008);
      box-shadow: 0 0 18px rgba(255, 136, 26, 0.95);
    }
    .xp-bar {
      outline-color: #6b6f78;
    }
    .xp-fill {
      background: linear-gradient(90deg, #d8d8d8, #ff9a2a 54%, #ff3c16);
      box-shadow: 0 0 18px rgba(255, 154, 42, 0.82);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(rgba(0, 0, 0, 0.42), rgba(60, 0, 0, 0.45)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 5px);
      text-align: center;
    }
    .boss-hud {
      position: absolute;
      left: 50%;
      bottom: 22px;
      width: min(680px, calc(100vw - 36px));
      transform: translateX(-50%);
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(8, 8, 9, 0.92), rgba(65, 5, 5, 0.88));
      border: 3px solid #090909;
      outline: 2px solid #b51d14;
      box-shadow: 7px 7px 0 rgba(0,0,0,0.62), 0 0 32px rgba(255, 45, 13, 0.24);
      color: #fff4e0;
      text-transform: uppercase;
      letter-spacing: 1px;
      pointer-events: none;
    }
    .boss-name {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 16px;
      text-shadow: 0 3px 0 #000;
    }
    .boss-bar {
      height: 18px;
      padding: 3px;
      background: #030303;
      border: 2px solid #252529;
      transform: skewX(-12deg);
      overflow: hidden;
    }
    .boss-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a2a, #ff3c16 45%, #7a0907);
      box-shadow: 0 0 18px rgba(255, 60, 22, 0.95);
      transform-origin: left center;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .shop-grid button {
      min-width: 0;
      margin: 0;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      transform: skewX(-6deg);
    }
    .shop-grid button:disabled {
      cursor: not-allowed;
      filter: grayscale(1) brightness(0.55);
    }
    .menu {
      width: min(570px, 94vw);
      padding: 28px;
      background: linear-gradient(145deg, rgba(11, 11, 13, 0.96), rgba(49, 6, 6, 0.95));
      border: 4px solid #1a1a1d;
      outline: 3px solid #8e1710;
      box-shadow: 10px 10px 0 rgba(0,0,0,0.66), 0 0 52px rgba(255, 37, 10, 0.18);
      color: #e8dfd2;
    }
    h1 {
      margin: 0 0 12px;
      color: #f4eee2;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 0.9;
      letter-spacing: 1px;
      text-shadow: 5px 5px 0 #000, 0 0 24px rgba(255, 45, 13, 0.8);
    }
    p {
      margin: 9px 0;
      color: #cbbfb1;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }
    button {
      margin-top: 20px;
      min-width: 184px;
      padding: 13px 18px;
      border: 3px solid #210505;
      outline: 2px solid #ff3c16;
      background: linear-gradient(#ff4b1e, #90120c);
      color: #fff4e0;
      font: inherit;
      font-size: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 7px 7px 0 #050505, 0 0 25px rgba(255, 45, 13, 0.42);
      transform: skewX(-8deg);
    }
    button:hover, button:focus {
      outline: 2px solid #ff9a2a;
      filter: brightness(1.1);
    }
    button:active {
      transform: translate(4px, 4px) skewX(-8deg);
      box-shadow: 3px 3px 0 #050505;
    }
    .hidden { display: none; }
    @media (max-width: 720px) {
      .game { width: 100vw; height: 100vh; min-height: 0; border: 0; }
      .hud { top: 9px; left: 9px; right: 9px; }
      .badge { min-width: 108px; padding: 7px 9px; font-size: 10px; }
      .badge strong { font-size: 18px; }
      .power-bar { width: 112px; }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <canvas id="canvas" aria-label="Memory Heist - Iron Style combat platformer"></canvas>
    <section class="hud">
      <div class="hud-left">
        <div class="badge">Power HP<strong id="hpText">3 / 3</strong><div class="power-bar"><div class="power-fill" id="hpFill"></div></div></div>
        <div class="badge">Fury<strong id="furyText">0%</strong><div class="power-bar fury-bar"><div class="power-fill fury-fill" id="furyFill"></div></div></div>
        <div class="badge">Level<strong id="levelText">LV 1</strong><div class="power-bar xp-bar"><div class="power-fill xp-fill" id="xpFill"></div></div></div>
        <div class="badge">Skill Pts<strong id="skillPointText">0</strong></div>
        <div class="badge">Class<strong id="classText">WARRIOR</strong></div>
        <div class="badge">Weapon<strong id="weaponText">IRON CLEAVER</strong></div>
      </div>
      <div class="hud-right">
        <div class="badge">Map<strong id="mapText">BLACK GATE</strong></div>
        <div class="badge">Scrap<strong id="scrapText">0</strong></div>
        <div class="badge">Survival<strong id="timeText">0.0s</strong></div>
        <div class="badge">Crushed<strong id="killText">0</strong></div>
        <div class="badge">Combo<strong id="comboText">x0</strong></div>
      </div>
    </section>
    <section class="boss-hud hidden" id="bossHud">
      <div class="boss-name"><span id="bossName">BOSS</span><span id="bossHpText">0 / 0</span></div>
      <div class="boss-bar"><div class="boss-fill" id="bossHpFill"></div></div>
    </section>
    <section class="overlay" id="overlay">
      <div class="menu">
        <h1>Memory Heist<br>Iron Style</h1>
        <p>Enter the ruined memory battlefield. Break every patrol that gets close.</p>
        <p>Move: A/D or Arrows. Jump: Space. Attack: J or Click. Shop: B.</p>
        <button id="startButton" type="button">Fight</button>
      </div>
    </section>
  </main>

          return {
            ...base,
            ...parsed,
            unlockedMaps: Math.max(1, parsed && parsed.unlockedMaps ? parsed.unlockedMaps : 1),

        }

            y: e.y,
            w: e.w,
            h: e.h,
            vx: e.vx,
            baseSpeed: e.baseSpeed,
            hp: e.hp,
            maxHp: e.maxHp,
            kind: e.kind,
            bossName: e.bossName,
            bossColor: e.bossColor,
            slam: e.slam,
            minX: e.minX,
            maxX: e.maxX,
            phase: e.phase
          })),
          projectiles: world.projectiles.map(p => ({ ...p }))
        };
        saveProfile();
      }

      function continueRun() {
        const run = profile.run;
        if (!run) return;
        if (classDefs[run.classId]) profile.classId = run.classId;
        currentMapIndex = clamp(run.map || 0, 0, Math.min(profile.unlockedMaps, maps.length) - 1);
        resetLevel();
        world.elapsed = run.elapsed || 0;
        kills = run.kills || 0;
        combo = run.combo || 0;
        comboTimer = run.comboTimer || 0;
        waveTimer = run.waveTimer || 4;
        activeWeapon = run.activeWeapon || 0;
        world.bossSpawned = !!run.bossSpawned;
        world.bossDefeated = !!run.bossDefeated;

        if (run.player) {
          player.x = run.player.x || player.x;
          player.y = run.player.y || player.y;
          player.vx = run.player.vx || 0;
          player.vy = run.player.vy || 0;
          player.level = run.player.level || 1;
          player.xp = run.player.xp || 0;
          player.xpToNext = run.player.xpToNext || 90;
          applyPermanentStats();
          player.hp = clamp(run.player.hp || player.maxHp, 1, player.maxHp);
          player.fury = clamp(run.player.fury || 0, 0, player.furyMax);
          player.berserkTimer = run.player.berserkTimer || 0;
          player.berserkInvincible = run.player.berserkInvincible || 0;
          player.dashCooldown = run.player.dashCooldown || 0;
          player.facing = run.player.facing || 1;
        }

        if (Array.isArray(run.enemies)) {
          world.enemies = run.enemies.map(e => ({
            ...e,
            hurt: 0,
            phase: e.phase || rand(0, Math.PI * 2)
          }));
        }

        if (Array.isArray(run.projectiles)) {
          world.projectiles = run.projectiles.map(p => ({ ...p }));
        }

        cameraX = clamp(run.cameraX || player.x - viewW * 0.4, 0, world.width - viewW);
        dead = false;
        shopOpen = false;
        running = true;
        overlay.classList.add("hidden");
        lastTime = performance.now();
        syncHud();
        requestAnimationFrame(loop);
      }

      function upgradeCost(type) {
        const current = profile.upgrades[type] || 0;
        if (type === "vitality") return 80 + current * 70;
        if (type === "brutality") return 110 + current * 95;
        if (type === "focus") return 70 + current * 65;
        if (type === "heal") return 45;
        return 9999;
      }

      function buyUpgrade(type) {
        const cost = upgradeCost(type);
        if (profile.scrap < cost) return;
        if (type !== "heal" && profile.upgrades[type] >= 8) return;
        profile.scrap -= cost;

        if (type === "heal") {
          player.hp = player.maxHp;
          player.fury = clamp(player.fury + 35, 0, player.furyMax);
          world.messages.push({ text: "FIELD REPAIR", x: player.x + player.w / 2, y: player.y - 44, life: 1, max: 1 });
        } else {
          profile.upgrades[type] += 1;
          applyPermanentStats();
          player.hp = Math.min(player.maxHp, player.hp + 1);
          world.messages.push({ text: "UPGRADE BOUGHT", x: player.x + player.w / 2, y: player.y - 44, life: 1, max: 1 });
        }

        saveProfile();
        syncHud();
        if (shopOpen) renderShop();
      }

      function applyPermanentStats() {
        const cls = currentClass();
        player.maxHp = Math.max(1, 3 + cls.hp + profile.upgrades.vitality + Math.floor((profile.skills.ironSkin || 0) / 2) + Math.floor((player.level - 1) / 3));
        player.damageBonus = cls.damage + profile.upgrades.brutality + (profile.skills.ravager || 0) + Math.floor((player.level - 1) / 3);
        player.furyBonus = profile.upgrades.focus * 3 + (profile.skills.furyEngine || 0) * 5 + Math.floor(player.level / 2);
        player.speed = Math.round(255 * cls.speed);
        player.jump = Math.round(760 * cls.jump);
        player.classDamageMult = 1;
        player.classFuryMult = cls.fury;
        player.classDashMult = cls.dash;
        player.classBerserkBonus = cls.berserk;
        player.classCrit = cls.crit;
        player.classKnockback = cls.knockback;
      }

      function skillCost(id) {
        return 1 + (profile.skills[id] || 0);
      }

      function buySkill(id) {
        const def = skillDefs[id];
        if (!def) return;
        const rank = profile.skills[id] || 0;
        const cost = skillCost(id);
        if (rank >= def.max || profile.skillPoints < cost) return;
        profile.skillPoints -= cost;
        profile.skills[id] = rank + 1;
        applyPermanentStats();
        player.hp = Math.min(player.maxHp, player.hp + 1);
        world.messages.push({ text: `${def.name} +1`, x: player.x + player.w / 2, y: player.y - 46, life: 1, max: 1 });
        saveProfile();
        syncHud();
        if (skillOpen) renderSkillTree();
      }

      function currentMap() {
        return maps[clamp(currentMapIndex, 0, maps.length - 1)];
      }

      function currentClass() {
        return classDefs[profile.classId] || classDefs.warrior;
      }

      function selectClass(id) {
        if (!classDefs[id] || running) return;
        profile.classId = id;
        profile.run = null;
        activeWeapon = classDefs[id].weapon;
        menuStep = "map";
        saveProfile();
        renderStartMenu();
      }

      function selectMap(index) {
        if (index < 0 || index >= Math.min(profile.unlockedMaps, maps.length)) return;
        currentMapIndex = index;
        profile.selectedMap = index;
        saveProfile();
        renderStartMenu();
      }

      function showClassSelect() {
        menuStep = "class";
        renderStartMenu();
      }

      function findPlatformAtX(x) {
        return world.platforms
          .filter(p => x >= p.x && x <= p.x + p.w)
          .sort((a, b) => a.y - b.y)[0] || world.platforms.find(p => p.type === "ground") || world.platforms[0];
      }

      function resize() {
        const rect = gameEl.getBoundingClientRect();
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        viewW = Math.floor(rect.width);
        viewH = Math.floor(rect.height);
        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function overlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function platform(x, y, w, h, type = "iron") {
        return { x, y, w, h, type };
      }

      function resetLevel() {
        currentMapIndex = clamp(currentMapIndex, 0, Math.min(profile.unlockedMaps, maps.length) - 1);
        const map = currentMap();
        world.width = map.width;
        world.elapsed = 0;
        world.platforms = [];
        world.enemies = [];
        world.clouds = [];
        world.debris = [];
        world.particles = [];
        world.projectiles = [];
        world.slashes = [];
        world.sparks = [];
        world.messages = [];
        world.bossSpawned = false;
        world.bossDefeated = false;
        cameraX = 0;
        shake = 0;
        flash = 0;
        kills = 0;
        combo = 0;
        comboTimer = 0;
        waveTimer = 4;
        autosaveTimer = 6;
        activeWeapon = currentClass().weapon;
        dead = false;

        player.x = 80;
        player.y = 240;
        player.vx = 0;
        player.vy = 0;
        player.level = 1;
        player.xp = 0;
        player.xpToNext = 90;
        applyPermanentStats();
        player.hp = player.maxHp;
        player.fury = 0;
        player.rageMode = 0;
        player.berserkTimer = 0;
        player.berserkInvincible = 0;
        player.dashTimer = 0;
        player.dashCooldown = 0;
        player.invincible = 0;
        player.attackTimer = 0;
        player.attackCooldown = 0;
        player.facing = 1;
        player.anim = 0;
        player.onGround = false;

        world.platforms = map.platforms.map(p => platform(p[0], p[1], p[2], p[3], p[4]));

        for (let i = 0; i < 20; i++) {
          world.clouds.push({ x: rand(-220, world.width), y: rand(45, 230), s: rand(0.75, 1.65), speed: rand(4, 12) });
        }

        for (let i = 0; i < 68; i++) {
          world.debris.push({
            x: rand(20, world.width - 30),
            y: 580,
            w: rand(10, 32),
            h: rand(8, 30),
            tilt: rand(-0.35, 0.35),
            color: ["#19191c", "#27272b", "#3a1512", "#4a4a50"][Math.floor(rand(0, 4))]
          });
        }
        placeDebris();

        for (const [spawnX, kind] of map.enemySpawns) {
          const p = findPlatformAtX(spawnX);
          spawnEnemyOnPlatform(p, kind, spawnX);
        }
      }

      function placeDebris() {
        for (const d of world.debris) {
          const ground = world.platforms.find(p => p.type === "ground" && d.x >= p.x && d.x <= p.x + p.w);
          d.y = ground ? ground.y - d.h + 2 : 580;
        }
      }

      function spawnEnemyOnPlatform(p, forcedKind = null, fixedX = null) {
        const map = currentMap();
        const pooled = map.enemyPool[Math.floor(rand(0, map.enemyPool.length))] || "sentinel";
        const kind = forcedKind || pooled;
        const stats = enemyStats(kind);
        const scale = stats.scale;
        const speedBase = rand(stats.speedMin, stats.speedMax);
        const speed = speedBase * (Math.random() > 0.5 ? 1 : -1);
        world.enemies.push({
          x: fixedX !== null ? clamp(fixedX, p.x + 18, p.x + p.w - 60) : p.x + rand(18, Math.max(20, p.w - 60)),
          y: p.y - 42 * scale,
          w: 42 * scale,
          h: 40 * scale,
          vx: speed,
          baseSpeed: Math.abs(speed),
          hp: stats.hp,
          maxHp: stats.hp,
          kind,
          hurt: 0,
          attackTimer: rand(stats.attackMin, stats.attackMax),
          dashTimer: 0,
          minX: p.x + 10,
          maxX: p.x + p.w - 52 * scale,
          phase: rand(0, Math.PI * 2)
        });
      }

      function enemyStats(kind) {
        const table = {
          sentinel: { hp: 3, scale: 1, speedMin: 62, speedMax: 92, attackMin: 2.4, attackMax: 3.8 },
          stalker: { hp: 2, scale: 0.9, speedMin: 118, speedMax: 152, attackMin: 1.5, attackMax: 2.5 },
          archer: { hp: 3, scale: 0.96, speedMin: 34, speedMax: 58, attackMin: 1.55, attackMax: 2.35 },
          assassin: { hp: 3, scale: 0.88, speedMin: 130, speedMax: 172, attackMin: 1.15, attackMax: 1.85 },
          elite: { hp: 7, scale: 1.12, speedMin: 48, speedMax: 76, attackMin: 2.0, attackMax: 3.0 },
          crusher: { hp: 6, scale: 1.25, speedMin: 38, speedMax: 62, attackMin: 2.1, attackMax: 3.2 },
          ember: { hp: 3, scale: 0.95, speedMin: 56, speedMax: 82, attackMin: 1.8, attackMax: 2.7 },
          hellhound: { hp: 3, scale: 0.92, speedMin: 125, speedMax: 162, attackMin: 1.35, attackMax: 2.15 },
          magma: { hp: 7, scale: 1.32, speedMin: 34, speedMax: 54, attackMin: 2.2, attackMax: 3.4 },
          bomber: { hp: 4, scale: 1.05, speedMin: 42, speedMax: 68, attackMin: 1.9, attackMax: 3.1 },
          wraith: { hp: 2, scale: 0.86, speedMin: 132, speedMax: 170, attackMin: 1.2, attackMax: 2 },
          seer: { hp: 4, scale: 1, speedMin: 44, speedMax: 70, attackMin: 1.5, attackMax: 2.4 },
          voidguard: { hp: 8, scale: 1.28, speedMin: 36, speedMax: 58, attackMin: 2.4, attackMax: 3.6 }
        };
        return table[kind] || { hp: 3, scale: 1, speedMin: 65, speedMax: 100, attackMin: 2, attackMax: 3 };
      }

      function spawnBoss() {
        if (world.bossSpawned) return;
        const map = currentMap();
        const ground = world.platforms
          .filter(p => p.type === "ground" && p.x > cameraX + viewW * 0.55)
          .sort((a, b) => Math.abs(a.x - (cameraX + viewW * 0.82)) - Math.abs(b.x - (cameraX + viewW * 0.82)))[0] ||
          world.platforms.find(p => p.type === "ground");
        if (!ground) return;
        world.bossSpawned = true;
        const hp = map.bossHp + player.level * 5 + Math.floor(world.elapsed / 12);
        world.enemies.push({
          x: clamp(cameraX + viewW + 80, ground.x + 20, ground.x + ground.w - 96),
          y: ground.y - 92,
          w: 92,
          h: 90,
          vx: -70,
          baseSpeed: 82,
          hp,
          maxHp: hp,
          kind: "boss",
          bossName: map.bossName,
          bossColor: map.bossColor,
          hurt: 0,
          slam: 2.5,
          minX: ground.x + 8,
          maxX: ground.x + ground.w - 100,
          phase: rand(0, Math.PI * 2)
        });
        flash = Math.max(flash, 0.55);
        shake = Math.max(shake, 24);
        world.messages.push({ text: `BOSS: ${map.bossName}`, x: cameraX + viewW * 0.5, y: 130, life: 2.1, max: 2.1 });
      }

      function activeBoss() {
        return world.enemies.find(e => e.kind === "boss" && e.hp > 0);
      }

      function startGame() {
        resize();
        profile.run = null;
        saveProfile();
        resetLevel();
        running = true;
        overlay.classList.add("hidden");
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function gameOver() {
        if (dead) return;
        dead = true;
        running = false;
        shopOpen = false;
        profile.run = null;
        shake = 26;
        flash = 1;
        saveProfile();
        syncHud();
        render();
        overlay.innerHTML = `
          <div class="menu">
            <h1>Defeated</h1>
            <p>The battlefield memory crushed your armor.</p>
            <p>Survived: ${world.elapsed.toFixed(1)}s | Crushed: ${kills} | Level: ${player.level}</p>
            <button id="restartButton" type="button">Fight Again</button>
            <button id="mapSelectButton" type="button">Map Select</button>
          </div>
        `;
        overlay.classList.remove("hidden");
        document.getElementById("restartButton").addEventListener("click", startGame);
        document.getElementById("mapSelectButton").addEventListener("click", () => {
          menuStep = "map";
          renderStartMenu();
        });
      }

      function renderStartMenu() {
        if (menuStep === "class") {
          const classButtons = Object.entries(classDefs).map(([id, cls]) => {
            const selected = id === profile.classId;
            return `<button data-class="${id}">${selected ? "> " : ""}${cls.name}<br><small>${cls.role}<br>${cls.desc}</small></button>`;
          }).join("");

          overlay.innerHTML = `
            <div class="menu">
              <h1>Choose Class</h1>
              <p>Pick your combat style first. Class changes HP, weapon, speed, Fury, Dash, and crits.</p>
              <div class="shop-grid">${classButtons}</div>
            </div>
          `;
          overlay.querySelectorAll("[data-class]").forEach(btn => {
            btn.addEventListener("click", () => selectClass(btn.dataset.class));
          });
          overlay.classList.remove("hidden");
          return;
        }

        const mapButtons = maps.map((map, index) => {
          const unlocked = index < profile.unlockedMaps;
          const selected = index === currentMapIndex;
          const cleared = profile.clearedMaps.includes(index) ? " CLEARED" : "";
          const label = unlocked ? `${selected ? "> " : ""}${map.name}` : "LOCKED";
          const desc = unlocked ? `${map.subtitle} | Boss: ${map.bossName}${cleared}` : "Defeat the previous boss";
          return `<button data-map="${index}" ${unlocked ? "" : "disabled"}>${label}<br><small>${desc}</small></button>`;
        }).join("");

        overlay.innerHTML = `
          <div class="menu">
            <h1>Choose Map</h1>
            <p>Class locked for this run: ${currentClass().name}. Current map: ${currentMap().name}</p>
            <p>Move: A/D or Arrows. Jump: Space. Dash: Shift. Berserk: Q. Attack: J or Click. Shop: B.</p>
            <div class="shop-grid">${mapButtons}</div>
            ${profile.run ? `<button id="continueButton" type="button">Continue Saved Run</button>` : ""}
            <button id="startButtonDynamic" type="button">Fight</button>
            <button id="backClassButton" type="button">Change Class</button>
            <button id="skillTreeMenuButton" type="button">Skill Tree</button>
          </div>
        `;
        overlay.querySelectorAll("[data-map]").forEach(btn => {
          btn.addEventListener("click", () => selectMap(Number(btn.dataset.map)));
        });
        const continueButton = document.getElementById("continueButton");
        if (continueButton) continueButton.addEventListener("click", continueRun);
        document.getElementById("startButtonDynamic").addEventListener("click", startGame);
        document.getElementById("backClassButton").addEventListener("click", showClassSelect);
        document.getElementById("skillTreeMenuButton").addEventListener("click", openSkillTree);
        overlay.classList.remove("hidden");
      }

      function openShop() {
        if (dead || shopOpen) return;
        shopOpen = true;
        running = false;
        renderShop();
        overlay.classList.remove("hidden");
      }

      function closeShop() {
        if (!shopOpen) return;
        shopOpen = false;
        overlay.classList.add("hidden");
        saveRun();
        if (!dead) {
          running = true;
          lastTime = performance.now();
          requestAnimationFrame(loop);
        }
      }

      function renderShop() {
        const up = profile.upgrades;
        const button = (type, label, desc) => {
          const cost = upgradeCost(type);
          const capped = type !== "heal" && up[type] >= 8;
          const disabled = profile.scrap < cost || capped ? "disabled" : "";
          const suffix = capped ? "MAX" : `${cost} SCRAP`;
          return `<button data-buy="${type}" ${disabled}>${label}<br><small>${desc}<br>${suffix}</small></button>`;
        };

        overlay.innerHTML = `
          <div class="menu">
            <h1>War Shop</h1>
            <p>Scrap: ${profile.scrap} | Best: ${profile.bestTime.toFixed(1)}s | Bosses: ${profile.bossesDefeated}</p>
            <div class="shop-grid">
              ${button("vitality", `VITALITY +${up.vitality}`, "+1 permanent max HP")}
              ${button("brutality", `BRUTALITY +${up.brutality}`, "+1 permanent damage")}
              ${button("focus", `FOCUS +${up.focus}`, "+3 permanent fury gain")}
              ${button("heal", "FIELD REPAIR", "Full heal + fury")}
            </div>
            <button id="resumeButton" type="button">Resume</button>
            <button id="skillTreeButton" type="button">Skill Tree</button>
            <button id="saveButton" type="button">Save</button>
          </div>
        `;
        overlay.querySelectorAll("[data-buy]").forEach(btn => {
          btn.addEventListener("click", () => buyUpgrade(btn.dataset.buy));
        });
        document.getElementById("resumeButton").addEventListener("click", closeShop);
        document.getElementById("skillTreeButton").addEventListener("click", () => {
          skillReturnMode = "shop";
          renderSkillTree();
        });
        document.getElementById("saveButton").addEventListener("click", () => {
          saveRun();
          renderShop();
        });
      }

      function openSkillTree() {
        if (dead) return;
        skillReturnMode = running ? "game" : "menu";
        skillOpen = true;
        shopOpen = false;
        if (running) running = false;
        renderSkillTree();
        overlay.classList.remove("hidden");
      }

      function closeSkillTree() {
        if (!skillOpen) return;
        skillOpen = false;
        overlay.classList.add("hidden");
        saveProfile();
        if (skillReturnMode === "shop") {
          shopOpen = true;
          renderShop();
          overlay.classList.remove("hidden");
        } else if (skillReturnMode === "menu" || dead) {
          renderStartMenu();
        } else if (!dead) {
          running = true;
          lastTime = performance.now();
          requestAnimationFrame(loop);
        }
      }

      function renderSkillTree() {
        skillOpen = true;
        shopOpen = false;
        const cards = Object.entries(skillDefs).map(([id, def]) => {
          const rank = profile.skills[id] || 0;
          const cost = skillCost(id);
          const capped = rank >= def.max;
          const disabled = capped || profile.skillPoints < cost ? "disabled" : "";
          const price = capped ? "MAX" : `${cost} SP`;
          return `<button data-skill="${id}" ${disabled}>${def.name} ${rank}/${def.max}<br><small>${def.desc}<br>${price}</small></button>`;
        }).join("");

        overlay.innerHTML = `
          <div class="menu">
            <h1>Skill Tree</h1>
            <p>Skill Points: ${profile.skillPoints} | Level: ${player.level}</p>
            <div class="shop-grid">${cards}</div>
            <button id="skillBackButton" type="button">Back</button>
          </div>
        `;
        overlay.querySelectorAll("[data-skill]").forEach(btn => {
          btn.addEventListener("click", () => buySkill(btn.dataset.skill));
        });
        document.getElementById("skillBackButton").addEventListener("click", closeSkillTree);
        overlay.classList.remove("hidden");
      }

      function left() { return keys.has("a") || keys.has("arrowleft"); }
      function right() { return keys.has("d") || keys.has("arrowright"); }
      function jump() { return keys.has(" "); }

      function currentWeapon() {
        return weapons[activeWeapon];
      }

      function switchWeapon(index) {
        if (index < 0 || index >= weapons.length) return;
        activeWeapon = index;
        if (running) {
          const weapon = currentWeapon();
          world.messages.push({ text: weapon.shortName, x: player.x + player.w / 2, y: player.y - 38, life: 0.75, max: 0.75 });
          spark(player.x + player.w / 2, player.y + 18, weapon.color, 10);
        }
      }

      function cycleWeapon() {
        switchWeapon((activeWeapon + 1) % weapons.length);
      }

      function tryDash() {
        if (!running || player.dashCooldown > 0 || dead) return;
        const rank = profile.skills.assassinDash || 0;
        player.dashTimer = 0.18;
        player.dashCooldown = Math.max(0.45, 1.05 * player.classDashMult * (1 - rank * 0.08));
        player.invincible = Math.max(player.invincible, 0.28);
        player.vx = player.facing * 720;
        player.vy = Math.min(player.vy, 90);
        shake = Math.max(shake, 6);
        dust(player.x + player.w / 2 - player.facing * 20, player.y + player.h - 5, 16, "#ff4b1e");
        world.messages.push({ text: "DASH", x: player.x + player.w / 2, y: player.y - 38, life: 0.45, max: 0.45 });
      }

      function activateBerserk() {
        if (!running || dead || player.berserkTimer > 0 || player.fury < player.furyMax) return;
        player.fury = 0;
        player.berserkTimer = 6 + player.classBerserkBonus;
        player.berserkInvincible = 3;
        player.invincible = Math.max(player.invincible, 3);
        player.rageMode = Math.max(player.rageMode, 6);
        flash = Math.max(flash, 0.55);
        shake = Math.max(shake, 26);
        world.messages.push({ text: "BERSERK", x: player.x + player.w / 2, y: player.y - 68, life: 1.2, max: 1.2 });
        spark(player.x + player.w / 2, player.y + player.h / 2, "#ff2d10", 64);
      }

      function tryAttack() {
        if (!running || player.attackCooldown > 0) return;
        const weapon = currentWeapon();
        const special = player.berserkTimer > 0;
        player.attackTimer = special ? 0.34 : 0.22;
        player.attackCooldown = special ? weapon.specialCooldown : weapon.cooldown;
        player.vx += player.facing * (special ? weapon.lunge * 1.8 : weapon.lunge);
        player.rageMode = special ? 1.2 : player.rageMode;
        shake = Math.max(shake, special ? 12 : 3);

        const slash = attackBox(special, weapon);
        world.slashes.push({
          x: slash.x,
          y: slash.y,
          w: slash.w,
          h: slash.h,
          life: special ? 0.32 : 0.2,
          facing: player.facing,
          special,
          weapon: weapon.shortName,
          color: weapon.color,
          glow: weapon.glow,
          arc: weapon.arc,
          line: weapon.line
        });
        if (special) {
          world.messages.push({ text: `${weapon.shortName} RAGE`, x: player.x + player.w / 2, y: player.y - 34, life: 0.9, max: 0.9 });
          spark(player.x + player.w / 2 + player.facing * 48, player.y + 22, weapon.color, 30);
        }
        for (const e of world.enemies) {
          if (e.hp > 0 && overlap(slash, { x: e.x, y: e.y, w: e.w, h: e.h })) {
            let baseDamage = special ? weapon.damage + 2 : weapon.damage;
            if (e.kind === "boss") baseDamage += profile.skills.bossBreaker || 0;
            hitEnemy(e, baseDamage + player.damageBonus, (special ? weapon.knockback * 1.45 : weapon.knockback) * player.classKnockback, weapon);
          }
        }
      }

      function attackBox(special = false, weapon = currentWeapon()) {
        const w = special ? weapon.reach + 62 : weapon.reach;
        const h = special ? weapon.height + 30 : weapon.height;
        return {
          x: player.facing > 0 ? player.x + player.w - 6 : player.x - w + 6,
          y: player.y + (special ? -16 : Math.floor((player.h - h) / 2)),
          w,
          h
        };
      }

      function hitEnemy(e, damage = 1, force = 340, weapon = currentWeapon()) {
        if (e.kind === "elite" && player.berserkTimer <= 0 && Math.random() < 0.42) {
          e.hurt = 0.12;
          e.vx = player.facing * 180;
          shake = Math.max(shake, 9);
          spark(e.x + e.w / 2, e.y + e.h / 2, "#d8d8d8", 18);
          world.messages.push({ text: "BLOCKED", x: e.x + e.w / 2, y: e.y - 22, life: 0.7, max: 0.7 });
          player.fury = clamp(player.fury + 7, 0, player.furyMax);
          return;
        }

        let finalDamage = damage;
        if (combo >= 30) finalDamage *= 1.75;
        else if (combo >= 20) finalDamage *= 1.5;
        else if (combo >= 10) finalDamage *= 1.2;
        if (player.berserkTimer > 0) finalDamage *= 1.5;
        if (player.classCrit > 0 && Math.random() < player.classCrit) {
          finalDamage *= 2;
          world.messages.push({ text: "CRITICAL", x: e.x + e.w / 2, y: e.y - 45, life: 0.7, max: 0.7 });
        }
        finalDamage = Math.max(1, Math.ceil(finalDamage));

        e.hp -= finalDamage;
        e.hurt = 0.24;
        e.vx = player.facing * force;
        combo += 1;
        comboTimer = 2.1;
        if ([10, 20, 30].includes(combo)) {
          world.messages.push({ text: combo === 30 ? "30 HIT RAMPAGE" : `${combo} HIT`, x: player.x + player.w / 2, y: player.y - 72, life: 1, max: 1 });
          if (combo === 30) player.fury = player.furyMax;
        }
        const furyGain = Math.ceil((weapon.furyGain + player.furyBonus + finalDamage * 3) * player.classFuryMult);
        player.fury = clamp(player.fury + furyGain, 0, player.furyMax);
        shake = Math.max(shake, finalDamage > 1 ? 24 : 13);
        flash = Math.max(flash, finalDamage > 1 ? 0.34 : 0.22);
        spark(e.x + e.w / 2, e.y + e.h / 2, finalDamage > 1 ? weapon.color : weapon.glow, finalDamage > 1 ? 36 : 22);
        world.sparks.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, life: finalDamage > 1 ? 0.24 : 0.16, r: finalDamage > 1 ? 54 : 34 });
        if (e.hp <= 0) {
          kills += 1;
          const heavy = ["crusher", "magma", "voidguard", "brute"].includes(e.kind);
          const fast = ["stalker", "hellhound", "runner", "wraith"].includes(e.kind);
          const ranged = ["ember", "bomber", "seer"].includes(e.kind);
          const xpReward = e.kind === "boss" ? 360 : heavy ? 75 : fast ? 42 : ranged ? 58 : 48;
          const baseScrap = e.kind === "boss" ? 180 : heavy ? 22 : fast ? 11 : ranged ? 16 : 13;
          const scrapReward = Math.floor(baseScrap * (1 + (profile.skills.scavenger || 0) * 0.15));
          grantXP(xpReward);
          profile.scrap += scrapReward;
          if (e.kind === "boss") {
            profile.bossesDefeated += 1;
            world.bossDefeated = true;
            world.bossSpawned = false;
            if (!profile.clearedMaps.includes(currentMapIndex)) profile.clearedMaps.push(currentMapIndex);
            if (currentMapIndex + 1 < maps.length && profile.unlockedMaps <= currentMapIndex + 1) {
              profile.unlockedMaps = currentMapIndex + 2;
              world.messages.push({ text: `UNLOCKED: ${maps[currentMapIndex + 1].name}`, x: e.x + e.w / 2, y: e.y - 70, life: 2, max: 2 });
            }
            world.messages.push({ text: "+180 SCRAP  BOSS DOWN", x: e.x + e.w / 2, y: e.y - 34, life: 1.6, max: 1.6 });
          }
          saveProfile();
          player.fury = clamp(player.fury + 8, 0, player.furyMax);
          if (kills % 4 === 0 && player.hp < player.maxHp) {
            player.hp += 1;
            world.messages.push({ text: "EXECUTION HEAL", x: e.x + e.w / 2, y: e.y - 22, life: 1, max: 1 });
            spark(e.x + e.w / 2, e.y + e.h / 2, "#ffffff", 20);
          }
          burst(e.x + e.w / 2, e.y + e.h / 2);
        }
      }

      function grantXP(amount) {
        const comboBonus = combo >= 8 ? 1.35 : combo >= 4 ? 1.18 : 1;
        player.xp += Math.floor(amount * comboBonus);
        while (player.xp >= player.xpToNext) levelUp();
      }

      function levelUp() {
        player.xp -= player.xpToNext;
        player.level += 1;
        profile.skillPoints += 1;
        player.xpToNext = Math.floor(player.xpToNext * 1.34 + 35);
        applyPermanentStats();
        player.hp = Math.min(player.maxHp, player.hp + 1);
        player.fury = clamp(player.fury + 32, 0, player.furyMax);
        flash = Math.max(flash, 0.5);
        shake = Math.max(shake, 18);
        world.messages.push({ text: `LEVEL ${player.level}  +1 SKILL`, x: player.x + player.w / 2, y: player.y - 54, life: 1.35, max: 1.35 });
        spark(player.x + player.w / 2, player.y + player.h / 2, "#ff9a2a", 42);
        saveProfile();
      }

      function damagePlayer(fromX) {
        if (player.invincible > 0 || player.berserkInvincible > 0 || dead) return;
        player.hp -= 1;
        player.invincible = 1.05 + (profile.skills.ironSkin || 0) * 0.12;
        player.vx = player.x < fromX ? -430 : 430;
        player.vy = -330;
        flash = 0.85;
        shake = 22;
        spark(player.x + player.w / 2, player.y + player.h / 2, "#ffffff", 18);
        if (player.hp <= 0) gameOver();
      }

      function updatePlayer(dt) {
        const accel = player.onGround ? 2050 : 1350;
        const friction = player.onGround ? 2600 : 760;
        let input = 0;
        if (left()) input -= 1;
        if (right()) input += 1;

        if (input) {
          player.vx += input * accel * dt;
          player.facing = input;
        } else {
          const slow = friction * dt;
          if (Math.abs(player.vx) <= slow) player.vx = 0;
          else player.vx -= Math.sign(player.vx) * slow;
        }

        const maxSpeed = player.dashTimer > 0 ? 760 : player.speed;
        player.vx = clamp(player.vx, -maxSpeed, maxSpeed);

        if (jump() && player.onGround) {
          player.vy = -player.jump;
          player.onGround = false;
          dust(player.x + player.w / 2, player.y + player.h, 12, "#5e5e62");
          shake = Math.max(shake, 2);
        }

        player.vy += world.gravity * dt;
        player.x += player.vx * dt;
        collideX();
        player.y += player.vy * dt;
        collideY();
        player.x = clamp(player.x, 0, world.width - player.w);

        if (player.y > world.height + 140) damagePlayer(player.x + player.w / 2);
        if (player.y > world.height + 170 && player.hp > 0) {
          player.x = Math.max(40, cameraX + 90);
          player.y = 220;
          player.vy = 0;
        }

        player.anim += dt * (Math.abs(player.vx) > 25 && player.onGround ? 7 : 1.8);
        player.invincible = Math.max(0, player.invincible - dt);
        player.rageMode = Math.max(0, player.rageMode - dt);
        player.berserkTimer = Math.max(0, player.berserkTimer - dt);
        player.berserkInvincible = Math.max(0, player.berserkInvincible - dt);
        player.dashTimer = Math.max(0, player.dashTimer - dt);
        player.dashCooldown = Math.max(0, player.dashCooldown - dt);
        player.attackTimer = Math.max(0, player.attackTimer - dt);
        player.attackCooldown = Math.max(0, player.attackCooldown - dt);
      }

      function collideX() {
        const box = { x: player.x, y: player.y, w: player.w, h: player.h };
        for (const p of world.platforms) {
          if (!overlap(box, p)) continue;
          if (player.vx > 0) player.x = p.x - player.w;
          if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
          box.x = player.x;
        }
      }

      function collideY() {
        player.onGround = false;
        const box = { x: player.x, y: player.y, w: player.w, h: player.h };
        for (const p of world.platforms) {
          if (!overlap(box, p)) continue;
          if (player.vy > 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            if (Math.abs(player.vy) > 720) shake = Math.max(shake, 4);
          } else if (player.vy < 0) {
            player.y = p.y + p.h;
            player.vy = 0;
          }
          box.y = player.y;
        }
      }

      function updateEnemies(dt) {
        const pBox = { x: player.x + 7, y: player.y + 8, w: player.w - 14, h: player.h - 10 };
        const speedScale = 1 + world.elapsed * 0.014;

        for (const e of world.enemies) {
          e.phase += dt * 7;
          e.hurt = Math.max(0, e.hurt - dt);
          e.attackTimer -= dt;
          e.dashTimer = Math.max(0, e.dashTimer - dt);

          const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
          const isBoss = e.kind === "boss";
          const bossPhase = isBoss ? getBossPhase(e) : 1;
          if (isBoss && e.bossPhase !== bossPhase) {
            e.bossPhase = bossPhase;
            if (bossPhase > 1) {
              const label = bossPhase === 3 ? "BERSERK PHASE" : "PHASE 2";
              world.messages.push({ text: label, x: e.x + e.w / 2, y: e.y - 58, life: 1.25, max: 1.25 });
              flash = Math.max(flash, bossPhase === 3 ? 0.5 : 0.28);
              shake = Math.max(shake, bossPhase === 3 ? 28 : 18);
            }
          }
          const close = Math.abs(dx) < (isBoss ? 520 : 290) && Math.abs(player.y - e.y) < (isBoss ? 150 : 100);
          const phaseBoost = bossPhase === 3 ? 2 : bossPhase === 2 ? 1.35 : 1;
          if (close && e.hurt <= 0) e.vx += Math.sign(dx) * (isBoss ? 420 * phaseBoost : 300) * dt;
          if (!isBoss && close && e.attackTimer <= 0) enemySpecialAttack(e, dx);

          if (isBoss) {
            e.slam -= dt;
            if (e.slam <= 0) bossSpecialAttack(e, dx);
          }

          const maxSpeed = (e.baseSpeed * speedScale + (close ? (isBoss ? 95 : 70) : 0)) * phaseBoost;
          e.vx = clamp(e.vx, -maxSpeed, maxSpeed);
          e.x += e.vx * dt;

          if (e.x <= e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx || e.baseSpeed); }
          if (e.x >= e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx || e.baseSpeed); }

          if (overlap(pBox, { x: e.x + 4, y: e.y + 4, w: e.w - 8, h: e.h - 6 })) damagePlayer(e.x + e.w / 2);
        }

        world.enemies = world.enemies.filter(e => e.hp > 0);
      }

      function getBossPhase(e) {
        const ratio = e.maxHp > 0 ? e.hp / e.maxHp : 1;
        if (ratio <= 0.2) return 3;
        if (ratio <= 0.5) return 2;
        return 1;
      }

      function enemySpecialAttack(e, dx) {
        const dir = Math.sign(dx || e.vx || 1);
        const centerX = e.x + e.w / 2;
        const centerY = e.y + e.h / 2;
        const reset = () => {
          const stats = enemyStats(e.kind);
          e.attackTimer = rand(stats.attackMin, stats.attackMax);
        };

        if (e.kind === "assassin") {
          e.x = clamp(player.x + (Math.random() > 0.5 ? -95 : 95), e.minX, e.maxX);
          e.vx = dir * 390;
          e.dashTimer = 0.42;
          flash = Math.max(flash, 0.12);
          spark(centerX, centerY, "#ffffff", 16);
          reset();
          return;
        }

        if (["stalker", "hellhound", "runner", "wraith"].includes(e.kind)) {
          e.vx = dir * (e.kind === "wraith" ? 360 : 300);
          e.dashTimer = 0.35;
          spark(centerX, centerY, e.kind === "wraith" ? "#7b1cff" : "#ff4b1e", 10);
          reset();
          return;
        }

        if (["crusher", "magma", "voidguard", "elite"].includes(e.kind)) {
          shake = Math.max(shake, e.kind === "magma" ? 14 : 10);
          spark(centerX, e.y + e.h, e.kind === "voidguard" ? "#7b1cff" : "#ff9a2a", 18);
          if (Math.abs(dx) < 105 && Math.abs(player.y - e.y) < 105) damagePlayer(centerX);
          reset();
          return;
        }

        if (["archer", "ember", "bomber", "seer"].includes(e.kind)) {
          const speed = e.kind === "seer" ? 220 : e.kind === "bomber" ? 180 : e.kind === "archer" ? 320 : 260;
          spawnProjectile({
            x: centerX,
            y: centerY - 4,
            vx: dir * speed,
            vy: e.kind === "bomber" ? -260 : 0,
            gravity: e.kind === "bomber" ? 560 : 0,
            r: e.kind === "bomber" ? 12 : e.kind === "archer" ? 6 : 8,
            color: e.kind === "seer" ? "#7b1cff" : e.kind === "archer" ? "#d8d8d8" : "#ff4b1e",
            life: e.kind === "bomber" ? 2.4 : 2.1,
            type: e.kind
          });
          reset();
        }
      }

      function bossSpecialAttack(e, dx) {
        const dir = Math.sign(dx || e.vx || 1);
        const phase = getBossPhase(e);
        const phaseRate = phase === 3 ? 0.5 : phase === 2 ? 0.72 : 1;
        e.slam = rand(2.0, 3.1) * phaseRate;
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        shake = Math.max(shake, 22);

        if (e.bossName === "THE FURNACE KING") {
          const count = phase === 3 ? 5 : phase === 2 ? 4 : 3;
          for (let i = 0; i < count; i++) {
            const spread = i - (count - 1) / 2;
            spawnProjectile({ x: cx, y: cy - 8, vx: dir * (220 + spread * 38), vy: -180 + spread * 70, gravity: 460, r: 13, color: "#ff6a00", life: 2.7, type: "bossfire" });
          }
          if (phase >= 2) spawnProjectile({ x: cx, y: e.y + e.h - 16, vx: dir * 285, vy: 0, gravity: 0, r: 15, color: "#ff9a2a", life: 1.35, type: "flamewave" });
          spark(cx, cy, "#ff6a00", 28);
          return;
        }

        if (e.bossName === "NULL TYRANT") {
          e.x = clamp(player.x + (Math.random() > 0.5 ? -150 : 150), e.minX, e.maxX);
          const lanes = phase === 3 ? [-2, -1, 0, 1, 2] : phase === 2 ? [-1.5, -0.5, 0.5, 1.5] : [-1, 0, 1];
          for (const lane of lanes) {
            spawnProjectile({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: dir * (260 + phase * 28), vy: lane * 82, gravity: 0, r: 10, color: "#7b1cff", life: 2.2, type: "voidbolt" });
          }
          if (phase === 3) e.vx = dir * 410;
          flash = Math.max(flash, 0.25);
          spark(e.x + e.w / 2, e.y + e.h / 2, "#7b1cff", 34);
          return;
        }

        spark(cx, e.y + e.h, "#ff4b1e", 30);
        if (phase >= 2) {
          spawnProjectile({ x: cx, y: e.y + e.h - 14, vx: dir * (phase === 3 ? 420 : 300), vy: 0, gravity: 0, r: 14, color: "#ff3c16", life: 1.35, type: "shockwave" });
        }
        if (phase === 3) e.vx = dir * 460;
        if (Math.abs(dx) < 145 && Math.abs(player.y - e.y) < 125) damagePlayer(cx);
      }

      function spawnProjectile(projectile) {
        world.projectiles.push({ ...projectile, maxLife: projectile.life, spin: rand(-8, 8) });
      }

      function updateWorld(dt) {
        world.elapsed += dt;
        autosaveTimer -= dt;
        if (autosaveTimer <= 0 && running && !dead) {
          autosaveTimer = 8;
          saveRun();
        }
        comboTimer = Math.max(0, comboTimer - dt);
        if (comboTimer <= 0) combo = 0;
        waveTimer -= dt;
        if (waveTimer <= 0 && world.enemies.length < 26) {
          spawnReinforcement();
          waveTimer = Math.max(2.2, 5.2 - world.elapsed * 0.035);
        }
        const trigger = currentMap().bossTrigger;
        if (!world.bossSpawned && !world.bossDefeated && !activeBoss() && (world.elapsed >= trigger.time || kills >= trigger.kills || player.level >= trigger.level)) {
          spawnBoss();
        }
        for (const c of world.clouds) {
          c.x += c.speed * dt;
          if (c.x > world.width + 280) c.x = -300;
        }
        for (const p of world.particles) {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.rot += p.spin * dt;
        }
        updateProjectiles(dt);
        for (const s of world.slashes) s.life -= dt;
        for (const sp of world.sparks) sp.life -= dt;
        for (const m of world.messages) {
          m.life -= dt;
          m.y -= 34 * dt;
        }
        world.particles = world.particles.filter(p => p.life > 0);
        world.projectiles = world.projectiles.filter(p => p.life > 0);
        world.slashes = world.slashes.filter(s => s.life > 0);
        world.sparks = world.sparks.filter(s => s.life > 0);
        world.messages = world.messages.filter(m => m.life > 0);
        const target = player.x + player.w / 2 - viewW * 0.4;
        cameraX += (clamp(target, 0, world.width - viewW) - cameraX) * Math.min(1, dt * 7);
        shake = Math.max(0, shake - dt * 36);
        flash = Math.max(0, flash - dt * 3.1);
      }

      function updateProjectiles(dt) {
        const pBox = { x: player.x + 7, y: player.y + 8, w: player.w - 14, h: player.h - 10 };
        for (const p of world.projectiles) {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += (p.gravity || 0) * dt;
          p.rot = (p.rot || 0) + p.spin * dt;
          const box = { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
          if (overlap(pBox, box)) {
            p.life = 0;
            spark(p.x, p.y, p.color, 12);
            damagePlayer(p.x);
          }
          if (p.y > world.height + 80 || p.x < -200 || p.x > world.width + 200) p.life = 0;
        }
      }

      function spawnReinforcement() {
        const side = Math.random() > 0.5 ? 1 : -1;
        const targetX = clamp(cameraX + (side > 0 ? viewW + rand(60, 260) : -rand(80, 260)), 320, world.width - 320);
        const candidates = world.platforms
          .filter(p => p.x <= targetX && p.x + p.w >= targetX && p.w > 150)
          .sort((a, b) => Math.abs(a.y - player.y) - Math.abs(b.y - player.y));
        const p = candidates[0] || world.platforms[Math.floor(rand(0, world.platforms.length))];
        spawnEnemyOnPlatform(p);
        world.messages.push({ text: "REINFORCEMENTS", x: targetX, y: p.y - 46, life: 1.1, max: 1.1 });
      }

      function dust(x, y, count, color) {
        for (let i = 0; i < count; i++) addParticle(x, y, rand(-120, 120), rand(-150, -25), color, rand(4, 11), 0.62, 660);
      }

      function spark(x, y, color, count) {
        for (let i = 0; i < count; i++) addParticle(x, y, rand(-260, 260), rand(-240, 60), color, rand(3, 9), 0.58, 760);
      }

      function burst(x, y) {
        for (let i = 0; i < 38; i++) {
          addParticle(x, y, rand(-280, 280), rand(-280, 110), ["#ff4b1e", "#ff9a2a", "#ffffff", "#6a0907"][Math.floor(rand(0, 4))], rand(5, 12), 1, 820);
        }
      }

      function addParticle(x, y, vx, vy, color, size, max, gravity) {
        world.particles.push({
          x, y, vx, vy, gravity, size,
          life: rand(max * 0.48, max),
          max,
          color,
          rot: rand(0, Math.PI * 2),
          spin: rand(-15, 15)
        });
      }

      function polygon(points, fill, stroke = "#050505", line = 4) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = line;
          ctx.lineJoin = "miter";
          ctx.stroke();
        }
      }

      function drawBackground() {
        const palette = currentMap().palette;
        const sky = ctx.createLinearGradient(0, 0, 0, viewH);
        sky.addColorStop(0, palette.top);
        sky.addColorStop(0.5, palette.mid);
        sky.addColorStop(1, palette.bottom);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, viewW, viewH);

        ctx.save();
        ctx.translate(-cameraX * 0.06, 0);
        drawMoon(130, 92, palette.moon);
        for (let x = -420; x < world.width + 520; x += 560) {
          jaggedHill(x, viewH - 120, 380, palette.hillA);
          jaggedHill(x + 190, viewH - 85, 340, palette.hillB);
        }
        ctx.restore();

        ctx.save();
        ctx.translate(-cameraX * 0.18, 0);
        for (const c of world.clouds) smoke(c.x, c.y, c.s);
        ctx.restore();

        ctx.save();
        ctx.translate(-cameraX * 0.42, 0);
        for (let x = -220; x < world.width + 280; x += 210) ruin(x, viewH - 210 + Math.sin(x) * 8, 0.9);
        ctx.restore();
      }

      function drawMoon(x, y, color = "#b51d14") {
        const g = ctx.createRadialGradient(x, y, 10, x, y, 90);
        g.addColorStop(0, "rgba(255, 116, 62, 0.75)");
        g.addColorStop(1, "rgba(255, 45, 12, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, 38, 0, Math.PI * 2);
        ctx.fill();
      }

      function jaggedHill(x, y, w, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, viewH);
        for (let i = 0; i <= 8; i++) {
          const px = x + (w / 8) * i;
          const py = y + (i % 2 === 0 ? -rand(10, 55) : rand(8, 45));
          ctx.lineTo(px, py);
        }
        ctx.lineTo(x + w, viewH);
        ctx.closePath();
        ctx.fill();
      }

      function smoke(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.fillStyle = "rgba(55, 55, 60, 0.52)";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
        ctx.lineWidth = 3;
        polygon([[-28, 32], [-8, 6], [30, 0], [70, 22], [90, 52], [8, 58]], "rgba(55,55,60,0.52)", "rgba(0,0,0,0.22)", 3);
        ctx.restore();
      }

      function ruin(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        polygon([[0, 160], [0, 42], [30, 24], [56, 55], [56, 160]], "#18181c", "#070708", 4);
        polygon([[74, 160], [74, 12], [104, 0], [130, 32], [130, 160]], "#202026", "#070708", 4);
        polygon([[150, 160], [150, 64], [176, 42], [204, 72], [204, 160]], "#161619", "#070708", 4);
        ctx.fillStyle = "#4b1111";
        ctx.fillRect(82, 60, 28, 16);
        ctx.fillRect(12, 84, 28, 14);
        ctx.restore();
      }

      function drawPlatform(p) {
        const x = Math.round(p.x - cameraX), y = Math.round(p.y);
        if (p.type === "ground") {
          polygon([[x, y], [x + p.w, y - 5], [x + p.w, y + 26], [x, y + 30]], "#303036", "#050505", 5);
          ctx.fillStyle = "#151518";
          ctx.fillRect(x, y + 28, p.w, p.h - 28);
          ctx.fillStyle = "#48100e";
          ctx.fillRect(x, y + 23, p.w, 6);
          ctx.fillStyle = "rgba(0,0,0,0.34)";
          for (let bx = x + 12; bx < x + p.w; bx += 36) ctx.fillRect(bx, y + 48, 22, 10);
        } else {
          const top = p.type === "blood" ? "#821611" : "#44444b";
          const side = p.type === "blood" ? "#300807" : "#1d1d22";
          polygon([[x, y], [x + p.w, y - 8], [x + p.w - 8, y + 18], [x + 8, y + 26]], top, "#050505", 5);
          polygon([[x + 8, y + 26], [x + p.w - 8, y + 18], [x + p.w - 8, y + p.h], [x + 8, y + p.h]], side, "#050505", 4);
          ctx.fillStyle = "rgba(255, 99, 40, 0.28)";
          ctx.fillRect(x + 14, y + 2, p.w - 28, 4);
        }
      }

      function drawDebris() {
        for (const d of world.debris) {
          const x = d.x - cameraX;
          if (x < -40 || x > viewW + 40) continue;
          ctx.save();
          ctx.translate(x, d.y);
          ctx.rotate(d.tilt);
          polygon([[0, 0], [d.w, -3], [d.w - 2, d.h], [2, d.h + 2]], d.color, "#050505", 2);
          ctx.restore();
        }
      }

      function drawEnemies() {
        for (const e of world.enemies) {
          const x = e.x - cameraX;
          if (x < -80 || x > viewW + 80) continue;
          const y = e.y + Math.sin(e.phase) * 2;
          ctx.save();
          ctx.translate(x + e.w / 2, y + e.h / 2);
          ctx.scale(e.vx < 0 ? -1 : 1, 1);
          if (e.hurt > 0) ctx.globalAlpha = 0.62;
          if (e.kind === "boss") {
            const body = e.hurt > 0 ? "#ffffff" : (e.bossColor || "#2b0808");
            polygon([[-52, -34], [-18, -52], [28, -48], [58, -20], [50, 35], [15, 55], [-35, 46], [-62, 6]], body, "#050505", 8);
            polygon([[-62, -18], [-88, 10], [-68, 35], [-42, 12]], "#33333a", "#050505", 7);
            polygon([[58, -18], [92, 8], [74, 38], [40, 14]], "#33333a", "#050505", 7);
            polygon([[-28, 48], [-6, 52], [-14, 76], [-42, 76]], "#151518", "#050505", 6);
            polygon([[14, 50], [38, 46], [48, 75], [20, 77]], "#151518", "#050505", 6);
            polygon([[-24, -17], [-6, -23], [-3, -8], [-20, -6]], "#ff4b1e", "#050505", 3);
            polygon([[12, -24], [31, -17], [26, -5], [8, -8]], "#ff4b1e", "#050505", 3);
            polygon([[-42, -58], [-18, -48], [-58, -30]], "#6b6b73", "#050505", 5);
            polygon([[38, -58], [18, -48], [62, -30]], "#6b6b73", "#050505", 5);
            ctx.restore();
            continue;
          }
          const bodyColors = {
            sentinel: "#610d0d", stalker: "#7d270e", crusher: "#361b1b",
            ember: "#b7330d", hellhound: "#8f2608", magma: "#3a1008", bomber: "#5b2b0a",
            wraith: "#30104f", seer: "#16091f", voidguard: "#231333"
          };
          const body = e.hurt > 0 ? "#ffffff" : (bodyColors[e.kind] || "#610d0d");
          const outline = ["crusher", "magma", "voidguard"].includes(e.kind) ? 6 : 5;
          polygon([[-22, -14], [10, -19], [25, 2], [15, 22], [-18, 20], [-28, 0]], body, "#050505", outline);
          polygon([[-12, 22], [-1, 22], [-5, 35], [-18, 35]], "#202024", "#050505", 4);
          polygon([[7, 21], [20, 20], [23, 34], [9, 35]], "#202024", "#050505", 4);
          const eyeColor = ["wraith", "seer", "voidguard"].includes(e.kind) ? "#7b1cff" : "#ff4b1e";
          polygon([[-13, -3], [-1, -7], [2, 2], [-9, 4]], eyeColor, "#050505", 2);
          polygon([[8, -5], [18, -2], [13, 6], [5, 3]], eyeColor, "#050505", 2);
          if (["crusher", "magma", "voidguard"].includes(e.kind)) {
            polygon([[-20, -24], [-6, -15], [-28, -9]], "#5e5e62", "#050505", 3);
            polygon([[18, -24], [5, -15], [28, -9]], "#5e5e62", "#050505", 3);
          }
          if (["ember", "bomber", "seer"].includes(e.kind)) {
            polygon([[20, -4], [39, -1], [35, 8], [18, 7]], eyeColor, "#050505", 3);
          }
          if (["stalker", "hellhound", "runner", "wraith"].includes(e.kind)) {
            ctx.strokeStyle = eyeColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-28, -20);
            ctx.lineTo(-40, -31);
            ctx.moveTo(24, -20);
            ctx.lineTo(38, -32);
            ctx.stroke();
          }
          ctx.restore();

          ctx.fillStyle = "#050505";
          ctx.fillRect(x - 4, y - 16, e.w + 8, 8);
          ctx.fillStyle = "#ff4b1e";
          ctx.fillRect(x - 2, y - 14, (e.w + 4) * Math.max(0, e.hp / e.maxHp), 4);
        }
      }

      function drawPlayer() {
        const x = player.x - cameraX, y = player.y;
        const moving = Math.abs(player.vx) > 25 && player.onGround;
        const stomp = player.onGround ? Math.sin(player.anim) * (moving ? 2 : 0.8) : 0;
        const blink = player.invincible > 0 && Math.floor(player.invincible * 18) % 2 === 0;
        const weapon = currentWeapon();
        const cls = currentClass();
        const armor = profile.classId === "assassin" ? "#15151a" : profile.classId === "vanguard" ? "#3e3e46" : profile.classId === "berserker" ? "#3a0908" : "#29292e";
        const arm = profile.classId === "assassin" ? "#25252b" : profile.classId === "vanguard" ? "#55555f" : profile.classId === "berserker" ? "#4c1110" : "#3a3a40";
        if (blink) ctx.globalAlpha = 0.58;
        ctx.save();
        ctx.translate(x + player.w / 2, y + player.h / 2 + stomp);
        ctx.scale(player.facing, 1);

        ctx.fillStyle = "rgba(0,0,0,0.42)";
        ctx.beginPath();
        ctx.ellipse(0, 36, 31, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        polygon([[-30, 0], [-18, -24], [18, -24], [31, 0], [20, 26], [-20, 26]], armor, "#050505", 6);
        if (player.rageMode > 0) {
          ctx.strokeStyle = cls.color;
          ctx.shadowColor = cls.color;
          ctx.shadowBlur = 22;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(-34, -28);
          ctx.lineTo(0, -64);
          ctx.lineTo(35, -28);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        polygon([[-24, -5], [-42, 7], [-35, 22], [-18, 15]], arm, "#050505", 5);
        polygon([[24, -5], [45, 6], [38, 22], [18, 15]], arm, "#050505", 5);
        polygon([[-18, -39], [18, -39], [27, -24], [16, -8], [-16, -8], [-27, -24]], "#c9a17e", "#050505", 5);
        polygon([[-24, -42], [-3, -57], [22, -45], [27, -28], [10, -37], [-12, -33]], "#161616", "#050505", 4);
        polygon([[-12, -24], [-3, -27], [-1, -20], [-10, -19]], "#050505", null, 0);
        polygon([[8, -27], [17, -24], [15, -18], [6, -20]], "#050505", null, 0);
        ctx.strokeStyle = "#65110d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-8, -13);
        ctx.lineTo(8, -13);
        ctx.stroke();

        const step = Math.sin(player.anim) * (moving ? 5 : 1);
        polygon([[-18, 24], [-3, 24], [-6, 47 + step], [-24, 47 + step]], "#15151a", "#050505", 5);
        polygon([[4, 24], [20, 24], [25, 47 - step], [7, 47 - step]], "#15151a", "#050505", 5);
        polygon([[-28, 45 + step], [-4, 45 + step], [-3, 54 + step], [-32, 54 + step]], "#3a0b09", "#050505", 4);
        polygon([[5, 45 - step], [30, 45 - step], [34, 54 - step], [4, 54 - step]], "#3a0b09", "#050505", 4);

        drawEquippedWeapon(weapon);

        if (player.attackTimer > 0) {
          ctx.strokeStyle = weapon.color;
          ctx.shadowColor = weapon.glow;
          ctx.shadowBlur = 22;
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(28, -4, weapon.shortName === "CHAIN" ? 54 : 38, -0.95, 0.82);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      function drawEquippedWeapon(weapon) {
        ctx.save();
        ctx.translate(28, 5);
        ctx.rotate(player.attackTimer > 0 ? -0.55 : -0.2);
        ctx.strokeStyle = "#050505";
        ctx.lineCap = "square";
        if (weapon.shortName === "AXE") {
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(-4, 22);
          ctx.lineTo(18, -32);
          ctx.stroke();
          polygon([[9, -36], [40, -48], [35, -15], [12, -10]], weapon.color, "#050505", 5);
          polygon([[10, -36], [-15, -44], [-6, -15], [12, -10]], "#6f6f76", "#050505", 4);
        } else if (weapon.shortName === "CHAIN") {
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(-2, 18);
          ctx.lineTo(28, -10);
          ctx.lineTo(54, -2);
          ctx.stroke();
          polygon([[54, -10], [76, -3], [55, 8]], weapon.color, "#050505", 4);
        } else {
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(-5, 22);
          ctx.lineTo(30, -34);
          ctx.stroke();
          polygon([[21, -45], [43, -34], [17, 15], [2, 10]], weapon.color, "#050505", 5);
          polygon([[26, -32], [36, -28], [15, 8], [8, 5]], "#d8d8d8", null, 0);
        }
        ctx.restore();
      }

      function drawSlashes() {
        for (const s of world.slashes) {
          const x = s.x - cameraX;
          const total = s.special ? 0.32 : 0.2;
          const alpha = clamp(s.life / total, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(x + s.w / 2, s.y + s.h / 2);
          ctx.scale(s.facing, 1);
          ctx.shadowColor = s.glow || "#ff3c16";
          ctx.shadowBlur = s.special ? 48 : 28;
          ctx.strokeStyle = s.color || "#ff3c16";
          ctx.lineWidth = s.special ? s.line + 10 : s.line;
          ctx.beginPath();
          ctx.arc(0, 0, s.special ? s.arc + 34 : s.arc, -0.85, 0.86);
          ctx.stroke();
          ctx.strokeStyle = "#fff1c2";
          ctx.lineWidth = s.special ? 8 : 5;
          ctx.beginPath();
          ctx.arc(0, 0, s.special ? s.arc + 52 : s.arc + 11, -0.62, 0.62);
          ctx.stroke();
          if (s.weapon === "CHAIN") {
            ctx.strokeStyle = "rgba(255,255,255,0.72)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-s.arc * 0.75, -8);
            ctx.lineTo(s.arc * 0.95, 8);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawImpactSparks() {
        for (const s of world.sparks) {
          ctx.save();
          ctx.globalAlpha = clamp(s.life / 0.16, 0, 1);
          ctx.translate(s.x - cameraX, s.y);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 4;
          for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
            ctx.lineTo(Math.cos(a) * s.r, Math.sin(a) * s.r);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of world.particles) {
          ctx.save();
          ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
          ctx.translate(p.x - cameraX, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          polygon([[-p.size, -p.size * 0.3], [p.size * 0.8, -p.size], [p.size, p.size * 0.4], [-p.size * 0.5, p.size]], p.color, null, 0);
          ctx.restore();
        }
      }

      function drawProjectiles() {
        for (const p of world.projectiles) {
          const x = p.x - cameraX;
          if (x < -80 || x > viewW + 80) continue;
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(x, p.y);
          ctx.rotate(p.rot || 0);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 18;
          if (p.type === "bomber" || p.type === "bossfire") {
            polygon([[-p.r, -p.r], [p.r, -p.r * 0.4], [p.r * 0.7, p.r], [-p.r * 0.7, p.r * 0.8]], p.color, "#050505", 3);
          } else if (p.type === "seer" || p.type === "voidbolt") {
            polygon([[0, -p.r * 1.4], [p.r * 1.3, 0], [0, p.r * 1.4], [-p.r * 1.3, 0]], p.color, "#050505", 3);
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(0, 0, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#050505";
            ctx.lineWidth = 3;
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawMessages() {
        ctx.save();
        ctx.font = "22px Impact, Arial Black, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const m of world.messages) {
          const alpha = clamp(m.life / m.max, 0, 1);
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 5;
          ctx.strokeStyle = "#050505";
          ctx.fillStyle = m.text === "REINFORCEMENTS" ? "#ff4b1e" : "#fff1c2";
          ctx.strokeText(m.text, m.x - cameraX, m.y);
          ctx.fillText(m.text, m.x - cameraX, m.y);
        }
        ctx.restore();
      }

      function render() {
        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;
        ctx.save();
        ctx.translate(sx, sy);
        drawBackground();
        for (const p of world.platforms) {
          if (p.x + p.w >= cameraX - 60 && p.x <= cameraX + viewW + 60) drawPlatform(p);
        }
        drawDebris();
        drawEnemies();
        drawPlayer();
        drawSlashes();
        drawImpactSparks();
        drawProjectiles();
        drawParticles();
        drawMessages();
        ctx.restore();
        if (flash > 0) {
          ctx.fillStyle = `rgba(255, 45, 15, ${flash * 0.36})`;
          ctx.fillRect(0, 0, viewW, viewH);
        }
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        for (let y = 0; y < viewH; y += 5) ctx.fillRect(0, y, viewW, 1);
      }

      function syncHud() {
        const weapon = currentWeapon();
        const cls = currentClass();
        hpText.textContent = `${Math.max(0, player.hp)} / ${player.maxHp}`;
        hpFill.style.transform = `scaleX(${clamp(player.hp / player.maxHp, 0, 1)})`;
        furyText.textContent = player.berserkTimer > 0 ? "BERSERK" : player.fury >= player.furyMax ? "READY" : `${Math.floor(player.fury)}%`;
        furyFill.style.transform = `scaleX(${player.berserkTimer > 0 ? 1 : clamp(player.fury / player.furyMax, 0, 1)})`;
        levelText.textContent = `LV ${player.level}`;
        xpFill.style.transform = `scaleX(${clamp(player.xp / player.xpToNext, 0, 1)})`;
        skillPointText.textContent = String(profile.skillPoints);
        classText.textContent = cls.name.replace("IRON ", "").replace("BLOOD ", "").replace("NIGHT ", "");
        weaponText.textContent = weapon.name;
        mapText.textContent = currentMap().name;
        scrapText.textContent = String(profile.scrap);
        timeText.textContent = `${world.elapsed.toFixed(1)}s`;
        killText.textContent = String(kills);
        const comboMult = combo >= 30 ? " x1.75" : combo >= 20 ? " x1.5" : combo >= 10 ? " x1.2" : "";
        comboText.textContent = combo > 0 ? `x${combo}${comboMult}` : "x0";
        const boss = activeBoss();
        if (boss) {
          bossHud.classList.remove("hidden");
          bossName.textContent = boss.bossName || currentMap().bossName;
          bossHpText.textContent = `${Math.max(0, Math.ceil(boss.hp))} / ${boss.maxHp}`;
          bossHpFill.style.transform = `scaleX(${clamp(boss.hp / boss.maxHp, 0, 1)})`;
        } else {
          bossHud.classList.add("hidden");
        }
      }

      function loop(time) {
        if (!running) return;
        const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
        lastTime = time;
        frameTime = time;
        updatePlayer(dt);
        updateEnemies(dt);
        updateWorld(dt);
        syncHud();
        render();
        if (running) requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if (skillOpen) {
          if (k === "escape" || k === "n") {
            e.preventDefault();
            closeSkillTree();
          }
          return;
        }
        if (shopOpen) {
          if (k === "escape" || k === "b") {
            e.preventDefault();
            closeShop();
          }
          if (k === "n") {
            e.preventDefault();
            skillReturnMode = "shop";
            renderSkillTree();
          }
          return;
        }
        if (["a", "d", "arrowleft", "arrowright", " ", "shift"].includes(k)) {
          e.preventDefault();
          keys.add(k);
        }
        if (k === "shift") {
          e.preventDefault();
          tryDash();
        }
        if (k === "j") {
          e.preventDefault();
          tryAttack();
        }
        if (["1", "2", "3"].includes(k)) {
          e.preventDefault();
          switchWeapon(Number(k) - 1);
        }
        if (k === "q") {
          e.preventDefault();
          activateBerserk();
        }
        if (k === "e") {
          e.preventDefault();
          cycleWeapon();
        }
        if (k === "b") {
          e.preventDefault();
          if (running) openShop();
        }
        if (k === "n") {
          e.preventDefault();
          openSkillTree();
        }
        if (k === "v") {
          e.preventDefault();
          saveRun();
          world.messages.push({ text: "SAVED", x: player.x + player.w / 2, y: player.y - 50, life: 0.8, max: 0.8 });
        }
        if (!running && !shopOpen && k === " ") startGame();
      });

      window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
      canvas.addEventListener("mousedown", e => {
        e.preventDefault();
        if (e.button === 2) cycleWeapon();
        else tryAttack();
      });
      canvas.addEventListener("contextmenu", e => e.preventDefault());
      window.addEventListener("resize", () => { resize(); render(); });
      startButton.addEventListener("click", startGame);

      resize();
      resetLevel();
      syncHud();
      render();
      renderStartMenu();
    })();
  </script>
</body>
</html>
